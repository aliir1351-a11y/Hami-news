                        </div>
                        <div class="detail-item">
                            <span class="label">🎯 تارکت‌سه</span>
                            <span class="value highlight">0.5338$</span>
                        </div>
                    </div>
                    <div class="card-footer">
                        <span>✅ سیگنال فیوچرزی ۹ ساعت به +۴۰% سود رسید!</span>
                        <span class="pos">۸۰ پوزیشن</span>
                    </div>
                    <div style="margin-top:8px; font-size:11px; color:#474d57;">تاریخ انتشار: ۲۰۲۰/۰۵/۲۲</div>
                </div>

                <!-- CARD 3: JUP (LOSS) -->
                <div class="signal-card loss">
                    <div class="card-top">
                        <div class="coin-name">
                            <h3>JUP</h3>
                            <span class="leverage">3X</span>
                        </div>
                        <span class="pnl red">-18%</span>
                    </div>
                    <div class="card-details">
                        <div class="detail-item">
                            <span class="label">⏱ طی زمان (ساعت)</span>
                            <span class="value">۴۸ ساعت</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">📍 نقطه‌ورود</span>
                            <span class="value highlight">1.844$</span>
