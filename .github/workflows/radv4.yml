                <div class="placeholder-tab">
                    <div class="big-icon">📊</div>
                    <p><strong>نتایج عملکرد</strong></p>
                    <p style="font-size:13px; color:#474d57;">مجموع سود/زیان دوره</p>
                    <div style="margin-top:20px; width:100%; display:flex; gap:12px;">
                        <div style="flex:1; background:#1e2329; padding:14px; border-radius:14px; text-align:center;">
                            <div style="color:#0ecb81; font-size:22px; font-weight:700;">+۶۰%</div>
                            <div style="font-size:11px; color:#848e9c;">سود کل</div>
                        </div>
                        <div style="flex:1; background:#1e2329; padding:14px; border-radius:14px; text-align:center;">
                            <div style="color:#ea3943; font-size:22px; font-weight:700;">-۱۸%</div>
