                    </div>
                </div>
                <div style="margin-top:16px; text-align:center; color:#474d57; font-size:13px;">
                    <span>گفتگوی آنلاین | پشتیبانی ۲۴/۷</span>
                </div>
            </div>

            <!-- ========== TAB: پامپ (نمونه) ========== -->
            <div class="tab-page" id="tab-pump">
                <div class="placeholder-tab">
                    <div class="big-icon">🚀</div>
                    <p><strong>سیگنال‌های پامپ</strong></p>
                    <p style="font-size:13px; color:#474d57;">سیگنال PUMP با +۲۰% سود در ۲ روز</p>
                    <div style="margin-top:20px; background:#1e2329; padding:16px; border-radius:16px; width:100%;">
                        <div style="display:flex; justify-content:space-between;">
                            <span>نام</span><span>وضعیت</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; margin-top:10px; color:#0ecb81;">
                            <span>PUMP</span><span>✅ فعال</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ========== TAB: اسپات ========== -->
