                    <div class="card-footer">
                        <span style="color:#ea3943;">⚠️ سیگنال ضرر -۱۸% (مدیریت ریسک الزامی)</span>
                        <span class="pos">—</span>
                    </div>
                    <div style="margin-top:8px; font-size:11px; color:#474d57;">تاریخ انتشار: ۲۰۲۰/۰۵/۲۰</div>
                </div>

                <div style="background:#1e2329; border-radius:16px; padding:14px; margin-top:8px; text-align:center; border:1px dashed #2b3139;">
                    <span style="color:#848e9c; font-size:13px;">💡 لطفا ریسک فری کنید و حد ضرر را فعال نگه دارید.</span>
                </div>
            </div>

            <!-- ========== TAB: اخبار ========== -->
            <div class="tab-page" id="tab-news">
                <div class="section-title"><span></span> آخرین اخبار</div>

                <div class="news-item">
                    <span class="icon">📈</span>
                    <div class="text"><strong>پیشی گرفتن بیت کوین از طلا؛</strong> طبق این آمار حدود ۴۹.۶ میلیون آمریکایی...</div>
                </div>
                <div class="news-divider"></div>

                <div class="news-item">
                    <span class="icon">⚠️</span>
                    <div class="text"><strong>هشدار چنجالی مایکل بری:</strong> سقوط بیت کوین ادامه دارد.</div>
                </div>
                <div class="news-divider"></div>

                <div class="news-item">
                    <span class="icon">📉</span>
                    <div class="text"><strong>خروج سنگین سرمایه از ETF‌های بیت کوین؛</strong> ژانویه سایه سرخ پایان رسید.</div>
                </div>
                <div class="news-divider"></div>

                <div class="news-item">
                    <span class="icon">🐋</span>
                    <div class="text"><strong>خرید بیت کوین توسط نهنگ‌ها؛</strong> نهنگ‌ها در روند ترویج بازار فعال شدند.</div>
                </div>
                <div class="news-divider"></div>

                <div class="news-item">
                    <span class="icon">📜</span>
                    <div class="text"><strong>قوانین و مقررات استفاده از پلتفرم</strong> — مطالعه الزامی است.</div>
                </div>

                <div style="margin-top:20px; padding:12px; background:#1e2329; border-radius:14px; text-align:center; color:#474d57; font-size:13px;">
                    ⏳ بروزرسانی: لحظه‌ای
