                        </div>
                        <div class="detail-item">
                            <span class="label">📍 نقطه‌ورود</span>
                            <span class="value highlight">0.002804$</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">🎯 تارکت‌دو</span>
                            <span class="value highlight">0.002987$</span>
                        </div>
                    </div>
                    <div class="card-footer">
                        <span>✅ سیگنال فیوچرزی ۲ روز به +۲۰% سود رسید!</span>
                        <span class="pos">۶۰ پوزیشن</span>
                    </div>
                    <div style="margin-top:8px; font-size:11px; color:#474d57;">تاریخ انتشار: ۲۰۲۰/۰۵/۰۵</div>
                </div>

                <!-- CARD 2: APR (WIN) -->
                <div class="signal-card win">
                    <div class="card-top">
                        <div class="coin-name">
                            <h3>APR</h3>
                            <span class="leverage">3X</span>
                        </div>
                        <span class="pnl green">+40%</span>
                    </div>
                    <div class="card-details">
                        <div class="detail-item">
                            <span class="label">⏱ طی زمان (ساعت)</span>
                            <span class="value">۹ ساعت</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">📍 نقطه‌ورود</span>
