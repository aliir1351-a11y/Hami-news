<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حامی ماینر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
        }

        body {
            background: #0b0e11;
            color: #eaecf0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .app-container {
            max-width: 420px;
            width: 100%;
            background: #0b0e11;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            height: 780px;
            display: flex;
            flex-direction: column;
            border: 1px solid #2b3139;
        }

        /* HEADER */
        .app-header {
            background: #1e2329;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2b3139;
            flex-shrink: 0;
        }

        .app-header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0b90b, #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }

        .app-header .badge {
            background: #2b3139;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            color: #848e9c;
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 80px;
            scroll-behavior: smooth;
        }

        .main-content::-webkit-scrollbar {
            width: 3px;
        }
        .main-content::-webkit-scrollbar-thumb {
            background: #474d57;
            border-radius: 10px;
        }

        /* TABS PAGES */
        .tab-page {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .tab-page.active {
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========= SIGNAL CARD ========= */
        .signal-card {
            background: #1e2329;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border-right: 4px solid #f0b90b;
            transition: 0.2s;
        }
        .signal-card.loss {
            border-right-color: #ea3943;
        }
        .signal-card.win {
            border-right-color: #0ecb81;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .coin-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .coin-name h3 {
            font-size: 18px;
            font-weight: 700;
        }
        .leverage {
            background: #2b3139;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 12px;
            color: #f0b90b;
            font-weight: 600;
        }

        .pnl {
            font-size: 22px;
            font-weight: 700;
        }
        .pnl.green {
            color: #0ecb81;
        }
        .pnl.red {
            color: #ea3943;
        }

        .card-details {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 18px;
            background: #13171d;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .detail-item {
            display: flex;
            flex-direction: column;
            font-size: 13px;
        }
        .detail-item .label {
            color: #848e9c;
            font-size: 11px;
        }
        .detail-item .value {
            font-weight: 600;
            margin-top: 2px;
            color: #eaecf0;
        }
        .detail-item .value.highlight {
            color: #f0b90b;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #848e9c;
            border-top: 1px solid #2b3139;
            padding-top: 10px;
        }
        .card-footer .pos {
            color: #eaecf0;
            font-weight: 600;
        }
        .badge-time {
            background: #2b3139;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 11px;
            color: #848e9c;
        }

        /* ========= NEWS ========= */
        .news-item {
            background: #1e2329;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 12px;
            border-bottom: 1px solid #2b3139;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
        }
        .news-item .icon {
            font-size: 20px;
            color: #f0b90b;
            flex-shrink: 0;
        }
        .news-item .text {
            font-size: 14px;
            line-height: 1.6;
            color: #d1d5db;
        }
        .news-item .text strong {
            color: #eaecf0;
        }
        .news-divider {
            height: 1px;
            background: #2b3139;
            margin: 4px 0 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin: 18px 0 14px;
            color: #eaecf0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title span {
            background: #f0b90b;
            width: 4px;
            height: 20px;
            border-radius: 10px;
            display: inline-block;
        }

        /* ========= LOGIN PAGE ========= */
        .login-box {
            background: #1e2329;
            border-radius: 24px;
            padding: 36px 24px;
            margin-top: 30px;
            text-align: center;
        }
        .login-box .logo-lg {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #f0b90b, #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .login-box .sub {
            color: #848e9c;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .login-box label {
            display: block;
            text-align: right;
            font-size: 13px;
            color: #848e9c;
            margin-bottom: 6px;
        }
        .login-box input {
            width: 100%;
            padding: 14px 16px;
            background: #13171d;
            border: 1px solid #2b3139;
            border-radius: 14px;
            color: #eaecf0;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
            margin-bottom: 20px;
        }
        .login-box input:focus {
            border-color: #f0b90b;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f0b90b, #d49b0a);
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            color: #0b0e11;
            cursor: pointer;
            transition: 0.2s;
        }
        .login-btn:active {
            transform: scale(0.97);
        }
        .register-link {
            margin-top: 16px;
            color: #848e9c;
            font-size: 14px;
        }
        .register-link a {
            color: #f0b90b;
            text-decoration: none;
            font-weight: 600;
        }

        /* ========= BOTTOM NAV ========= */
        .bottom-nav {
            background: #1e2329;
            border-top: 1px solid #2b3139;
            display: flex;
            justify-content: space-around;
            padding: 8px 4px 12px;
            flex-shrink: 0;
            position: sticky;
            bottom: 0;
            width: 100%;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 11px;
            color: #848e9c;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            transition: 0.2s;
            background: transparent;
            border: none;
            min-width: 44px;
        }
        .nav-item .nav-icon {
            font-size: 20px;
            line-height: 1;
        }
        .nav-item.active {
            color: #f0b90b;
        }
        .nav-item.active .nav-icon {
            color: #f0b90b;
        }
        .nav-item:active {
            transform: scale(0.92);
        }

        /* placeholder for empty tabs */
        .placeholder-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
            color: #474d57;
            text-align: center;
        }
        .placeholder-tab .big-icon {
            font-size: 56px;
            margin-bottom: 16px;
            opacity: 0.4;
        }
        .placeholder-tab p {
            font-size: 15px;
        }

        /* misc */
        .mt-2 {
            margin-top: 8px;
        }
        .text-center {
            text-align: center;
        }
        .flex-1 {
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- HEADER -->
        <div class="app-header">
            <h1>⚡ حامی ماینر</h1>
            <span class="badge">v2.0</span>
