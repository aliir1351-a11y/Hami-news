                        </div>
                        <div style="display:flex; justify-content:space-between; margin-top:8px;">
                            <span>ETH/USDT</span><span>۳,۵۱۲$</span><span style="color:#ea3943;">-۱.۱%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ========== TAB: اعلان ========== -->
            <div class="tab-page" id="tab-alert">
                <div class="placeholder-tab">
                    <div class="big-icon">🔔</div>
                    <p><strong>اعلان‌ها</strong></p>
                    <p style="font-size:13px; color:#474d57;">هیچ اعلان جدیدی وجود ندارد.</p>
                    <div style="margin-top:16px; background:#1e2329; padding:12px 20px; border-radius:30px; font-size:13px; color:#848e9c;">
                        ✅ همه چیز به‌روز است
