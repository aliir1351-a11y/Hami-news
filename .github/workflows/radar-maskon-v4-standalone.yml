.refresh-button { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: 11px; padding: 8px 13px; color: var(--gold-ink); background: linear-gradient(180deg, var(--gold-bright), var(--gold)); box-shadow: 0 8px 22px rgba(211, 175, 105, .15); cursor: pointer; font-size: .75rem; font-weight: 800; }
.refresh-button svg { width: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.refresh-button.loading svg { display: none; }
.refresh-button:disabled { opacity: .68; cursor: wait; }
.active-filter { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; padding: 9px 13px; border: 1px dashed var(--line); border-radius: 11px; color: var(--muted); background: var(--surface-soft); font-size: .73rem; }
.active-filter button { border: 0; color: var(--gold-bright); background: transparent; cursor: pointer; }

.news-grid { display: flex; flex-direction: column; gap: 10px; }
.news-card { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-lg); background: linear-gradient(155deg, var(--surface), color-mix(in srgb, var(--surface-2) 70%, var(--surface))); box-shadow: var(--shadow-soft); transition: border-color .2s; }
.news-card:hover, .news-card.open { border-color: var(--line-strong); }
.news-card-head { width: 100%; display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 14px; border: 0; color: inherit; background: transparent; text-align: right; cursor: pointer; }
.source-color-0 { --source-color: #d3af69; }
.source-color-1 { --source-color: #3dd79b; }
.source-color-2 { --source-color: #6ca9ff; }
.source-color-3 { --source-color: #c994ff; }
.source-color-4 { --source-color: #ff9f72; }
.source-color-5 { --source-color: #69d2e7; }
.story-media { position: relative; width: 76px; height: 70px; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 13px; color: var(--source-color, var(--gold-bright)); background: linear-gradient(145deg, color-mix(in srgb, var(--source-color, var(--gold)) 16%, var(--surface-3)), var(--surface)); }
.story-media img { width: 100%; height: 100%; object-fit: cover; }
.story-media .source-initials { font-size: 1.25rem; font-weight: 900; letter-spacing: -.06em; direction: ltr; }
.story-media svg { position: absolute; width: 43px; left: -7px; bottom: -8px; fill: none; stroke: currentColor; stroke-width: 1.1; opacity: .16; }
.news-head-copy { min-width: 0; }
.news-kickers { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 7px; }
.region-badge, .new-badge, .feed-badge { display: inline-flex; align-items: center; min-height: 21px; padding: 3px 7px; border-radius: 99px; font-size: .62rem; font-weight: 700; }
.region-badge.iran { color: var(--green); background: var(--green-soft); }
.region-badge.world { color: var(--blue); background: var(--blue-soft); }
.new-badge { color: var(--gold-bright); border: 1px solid var(--line-strong); background: color-mix(in srgb, var(--gold) 8%, transparent); }
.feed-badge { max-width: 180px; overflow: hidden; color: var(--muted); background: var(--surface-2); text-overflow: ellipsis; white-space: nowrap; }
.news-head-copy h3 { margin: 0; font-size: .95rem; line-height: 1.72; }
.news-card-submeta { display: flex; flex-wrap: wrap; gap: 5px 13px; margin-top: 8px; color: var(--muted); font-size: .66rem; }
.news-card-submeta span { display: inline-flex; align-items: center; gap: 5px; }
.news-card-submeta svg { width: 13px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.news-head-side { min-width: 76px; display: flex; flex-direction: column; align-items: flex-end; gap: 11px; }
.compact-rating { direction: ltr; color: var(--muted); font-size: .65rem; }
.compact-rating b { color: var(--gold-bright); font-size: .76rem; }
.chevron { width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--gold-bright); transition: transform .22s, background .22s; }
.chevron svg { width: 15px; fill: none; stroke: currentColor; stroke-width: 2; }
.news-card.open .chevron { transform: rotate(180deg); background: color-mix(in srgb, var(--gold) 8%, transparent); }
.news-card-body { display: none; padding: 0 16px 16px; }
.news-card.open .news-card-body { display: block; animation: reveal .22s ease-out; }
@keyframes reveal { from { opacity: 0; transform: translateY(-4px); } }
.news-tabs { display: flex; gap: 5px; margin-bottom: 13px; padding-top: 4px; border-top: 1px solid var(--line); }
.news-tabs button { min-height: 35px; border: 0; border-bottom: 2px solid transparent; padding: 7px 10px; color: var(--muted); background: transparent; cursor: pointer; font-size: .72rem; }
.news-tabs button.active { color: var(--gold-bright); border-bottom-color: var(--gold); }
.news-text { margin: 0; color: var(--text-soft); font-size: .87rem; line-height: 2.05; white-space: pre-wrap; }
.translation-note { display: flex; align-items: center; gap: 8px; margin: 11px 0 0; color: var(--muted); font-size: .65rem; }
.translation-note::before { content: ""; width: 5px; height: 5px; flex: 0 0 auto; border-radius: 50%; background: var(--gold); }
.story-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 17px; padding-top: 12px; border-top: 1px dashed var(--line); }
.story-actions button, .story-actions a { min-height: 35px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; color: var(--text-soft); background: var(--surface); text-decoration: none; cursor: pointer; font-size: .68rem; }
.story-actions button:hover, .story-actions a:hover { color: var(--gold-bright); border-color: var(--line-strong); }
.story-actions button.saved { color: var(--gold-ink); border-color: var(--gold); background: var(--gold); }
.story-actions svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.story-actions .source-link { margin-inline-start: auto; }
.share-cluster { position: relative; }
.share-menu { position: absolute; z-index: 8; left: 0; bottom: calc(100% + 7px); min-width: 174px; display: none; gap: 3px; padding: 6px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); box-shadow: var(--shadow); }
.share-menu.open { display: grid; }
.share-menu a, .share-menu button { width: 100%; justify-content: flex-start; border: 0; background: transparent; }
.feedback-panel { display: grid; grid-template-columns: .72fr 1.28fr; gap: 16px; margin-top: 15px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: color-mix(in srgb, var(--surface-2) 76%, transparent); }
.rating-box h4, .comments-box h4 { margin: 0 0 10px; font-size: .78rem; }
.rating-summary { display: flex; align-items: baseline; gap: 7px; margin-bottom: 8px; }
.rating-summary strong { color: var(--gold-bright); font-size: 1.55rem; }
.rating-summary span { color: var(--muted); font-size: .65rem; }
.star-row { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 2px; direction: ltr; }
.star-row button { border: 0; padding: 1px; color: color-mix(in srgb, var(--muted) 46%, transparent); background: transparent; cursor: pointer; font-size: 1.32rem; line-height: 1; }
.star-row button.active, .star-row button:hover, .star-row button:has(~ button:hover) { color: var(--gold); }
.rating-help { margin: 8px 0 0; color: var(--muted); font-size: .62rem; }
.comment-form { display: grid; grid-template-columns: minmax(100px, .45fr) minmax(160px, 1fr) auto; align-items: end; gap: 7px; }
.comment-form label { display: grid; gap: 5px; color: var(--muted); font-size: .62rem; }
.comment-form input, .comment-form textarea { width: 100%; min-height: 38px; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; outline: 0; resize: vertical; color: var(--text); background: var(--surface); font-size: .7rem; }
.comment-form textarea { height: 38px; max-height: 110px; }
.comment-form input:focus, .comment-form textarea:focus { border-color: var(--line-strong); }
.comment-form button { min-height: 38px; border: 0; border-radius: 9px; padding: 8px 12px; color: var(--gold-ink); background: var(--gold); cursor: pointer; font-size: .68rem; font-weight: 700; }
.comment-form button:disabled { opacity: .6; cursor: wait; }
.honeypot { position: absolute !important; width: 1px !important; height: 1px !important; overflow: hidden !important; clip: rect(0 0 0 0) !important; white-space: nowrap !important; }
.comments-list { display: grid; gap: 7px; grid-column: 1 / -1; }
.comment-item { padding: 9px 10px; border-right: 2px solid var(--line-strong); border-radius: 7px; background: var(--surface); }
.comment-item header { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 5px; }
.comment-item strong { font-size: .67rem; }
.comment-item time { color: var(--muted); font-size: .58rem; }
.comment-item p { margin: 0; color: var(--text-soft); font-size: .68rem; line-height: 1.75; }
.empty-comments { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: .65rem; }

.empty-state, .error-state { display: grid; place-items: center; min-height: 260px; padding: 30px; border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); color: var(--muted); text-align: center; background: var(--surface-soft); }
.empty-state strong, .error-state strong { display: block; margin-bottom: 8px; color: var(--text); font-size: 1rem; }
.empty-state p, .error-state p { max-width: 520px; margin: 0; font-size: .75rem; line-height: 1.8; }
.error-state { color: var(--red); }
.load-more { min-width: 190px; min-height: 44px; display: block; margin: 18px auto 0; border: 1px solid var(--line-strong); border-radius: 12px; color: var(--gold-bright); background: var(--surface); cursor: pointer; font-size: .76rem; }
.load-more:hover { background: var(--surface-2); }
.skeleton-card { height: 106px; display: grid; grid-template-columns: 76px 1fr; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
.skeleton-block { overflow: hidden; border-radius: 10px; background: var(--surface-3); }
.skeleton-copy { display: grid; align-content: center; gap: 10px; }
.skeleton-line { position: relative; height: 11px; overflow: hidden; border-radius: 99px; background: var(--surface-3); }
.skeleton-line.short { width: 42%; }
.skeleton-line::after, .skeleton-block::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .07), transparent); transform: translateX(100%); animation: shimmer 1.35s infinite; }
@keyframes shimmer { to { transform: translateX(-100%); } }

.property-search { min-height: 270px; display: grid; grid-template-columns: .7fr 1.3fr; align-items: center; gap: 34px; margin-top: 65px; padding: 36px 46px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-xl); background: linear-gradient(120deg, color-mix(in srgb, var(--gold) 8%, var(--surface)), var(--surface)); box-shadow: var(--shadow); }
.property-art { display: grid; place-items: center; }
.property-art svg { width: min(240px, 90%); fill: color-mix(in srgb, var(--gold) 8%, transparent); stroke: var(--gold); stroke-width: 2; }
.property-copy h2 { margin: 0 0 8px; font-size: 1.45rem; }
.property-copy > p:not(.kicker) { margin: 0 0 20px; color: var(--muted); font-size: .8rem; line-height: 1.8; }
.property-copy form { display: grid; grid-template-columns: 1fr 150px auto; align-items: end; gap: 9px; }
.property-copy label { display: grid; gap: 6px; color: var(--muted); font-size: .65rem; }
.property-copy input, .property-copy select { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; outline: 0; color: var(--text); background: var(--bg-elevated); }
.property-buttons { display: flex; gap: 6px; }
.property-buttons button { min-height: 44px; border: 0; border-radius: 10px; padding: 9px 15px; color: #fff; cursor: pointer; font-weight: 700; }
.divar-button { background: #a62626; }
.sheypoor-button { background: #e96314; }

.newsletter { display: grid; grid-template-columns: 1fr .9fr; align-items: center; gap: 44px; margin-block: 70px; padding: 32px 38px; border: 1px solid var(--line); border-radius: var(--radius-xl); background: var(--surface); box-shadow: var(--shadow-soft); }
.newsletter-copy { display: flex; align-items: center; gap: 17px; }
.mail-icon { width: 58px; height: 58px; flex: 0 0 58px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 17px; color: var(--gold-bright); background: color-mix(in srgb, var(--gold) 8%, transparent); }
.mail-icon svg { width: 28px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.newsletter h2 { margin: 0 0 6px; font-size: 1.3rem; }
.newsletter-copy p:not(.kicker) { margin: 0; color: var(--muted); font-size: .74rem; line-height: 1.7; }
.newsletter form > label:first-child { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.email-row { display: grid; grid-template-columns: 1fr auto; }
.email-row input { min-width: 0; min-height: 46px; border: 1px solid var(--line); border-left: 0; border-radius: 0 11px 11px 0; padding: 10px 12px; outline: 0; direction: ltr; color: var(--text); background: var(--bg-elevated); text-align: left; }
.email-row button { min-height: 46px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 11px 0 0 11px; padding: 10px 16px; color: var(--gold-ink); background: var(--gold); cursor: pointer; font-weight: 800; font-size: .74rem; }
.consent { display: flex; align-items: flex-start; gap: 7px; margin-top: 9px; color: var(--muted); font-size: .63rem; line-height: 1.55; }
.consent input { margin-top: 2px; }
.form-message { min-height: 17px; margin: 6px 0 0; color: var(--muted); font-size: .65rem; }
.form-message.success { color: var(--green); }
.form-message.error { color: var(--red); }

.site-footer { border-top: 1px solid var(--line); background: var(--bg-elevated); }
.footer-shell { display: grid; grid-template-columns: 1fr auto; gap: 20px 40px; padding-block: 32px 38px; }
.footer-brand { display: flex; align-items: center; gap: 12px; }
.footer-brand img { padding: 3px; border-radius: 14px; background: #fff; object-fit: contain; }
.footer-brand div { display: flex; flex-direction: column; gap: 5px; }
.footer-brand strong { font-size: .85rem; }
.footer-brand span { color: var(--muted); font-size: .67rem; }
.footer-contact { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 17px; color: var(--muted); font-size: .68rem; }
.footer-contact a { color: var(--text-soft); text-decoration: none; }
.footer-contact a:hover { color: var(--gold-bright); }
.footer-note { grid-column: 1 / -1; max-width: 850px; margin: 0; color: var(--muted); font-size: .62rem; line-height: 1.9; }

.reader-dialog, .report-dialog { width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; color: var(--text); background: color-mix(in srgb, var(--bg) 92%, transparent); }
dialog::backdrop { background: rgba(4, 9, 15, .82); backdrop-filter: blur(6px); }
.reader-shell { min-height: 100%; padding-bottom: 70px; }
.reader-toolbar { position: sticky; z-index: 3; top: 0; min-height: 62px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 9px max(18px, env(safe-area-inset-left)); border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg-elevated) 91%, transparent); backdrop-filter: blur(17px); }
.dialog-close { width: 39px; height: 39px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--text-soft); background: var(--surface); cursor: pointer; font-size: 1.2rem; }
.reader-toolbar > .dialog-close { justify-self: start; }
.reader-label { color: var(--muted); font-size: .72rem; }
.reader-tools { justify-self: end; display: flex; gap: 6px; }
.reader-tools button { min-width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 9px; color: var(--text-soft); background: var(--surface); cursor: pointer; font-size: .7rem; }
.reader-tools svg { width: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; }
.reader-article { width: min(760px, calc(100% - 36px)); margin: 46px auto 0; }
.reader-source { display: flex; align-items: center; gap: 10px; color: var(--gold-bright); font-size: .72rem; }
.reader-source span:first-child { width: 35px; height: 35px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 800; direction: ltr; }
.reader-article h2 { margin: 18px 0 12px; font-size: clamp(1.65rem, 4vw, 2.7rem); line-height: 1.65; letter-spacing: -.035em; }
.reader-meta { margin: 0 0 30px; padding-bottom: 17px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: .73rem; }
.reader-body { color: var(--text-soft); font-size: var(--reader-size); line-height: 2.25; white-space: pre-wrap; }
.reader-dialog.reader-small { --reader-size: .96rem; }
.reader-dialog.reader-large { --reader-size: 1.22rem; }
.reader-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 35px; padding-top: 18px; border-top: 1px solid var(--line); }
.reader-actions a, .reader-actions button { min-height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 13px; color: var(--text-soft); background: var(--surface); text-decoration: none; cursor: pointer; font-size: .7rem; }
.report-dialog { display: none; place-items: center; padding: 18px; background: transparent; }
.report-dialog[open] { display: grid; }
.dialog-card { position: relative; width: min(520px, 100%); padding: 25px; border: 1px solid var(--line); border-radius: var(--radius-xl); background: var(--surface); box-shadow: var(--shadow); }
.dialog-card > .dialog-close { position: absolute; left: 17px; top: 17px; }
.dialog-card h2 { margin: 0 0 8px; font-size: 1.3rem; }
.dialog-card > p:not(.kicker, .form-message) { margin: 0 0 20px; color: var(--muted); font-size: .74rem; line-height: 1.8; }
.dialog-card label { display: grid; gap: 6px; margin-top: 12px; color: var(--muted); font-size: .68rem; }
.dialog-card select, .dialog-card textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px; color: var(--text); background: var(--bg-elevated); outline: 0; resize: vertical; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.dialog-actions button { min-height: 40px; border-radius: 10px; padding: 8px 15px; cursor: pointer; }
.dialog-actions .secondary { border: 1px solid var(--line); background: transparent; }
.dialog-actions .primary { border: 0; color: var(--gold-ink); background: var(--gold); font-weight: 700; }

.toast-region { position: fixed; z-index: 100; left: max(18px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); display: grid; gap: 8px; pointer-events: none; }
.toast { max-width: min(360px, calc(100vw - 36px)); padding: 11px 14px; border: 1px solid var(--line-strong); border-radius: 11px; color: var(--text-soft); background: var(--surface-2); box-shadow: var(--shadow); font-size: .72rem; line-height: 1.65; animation: toastIn .2s ease-out; }
.toast.success { border-color: color-mix(in srgb, var(--green) 42%, transparent); }
.toast.error { border-color: color-mix(in srgb, var(--red) 42%, transparent); }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }
.back-top { position: fixed; z-index: 24; left: max(22px, env(safe-area-inset-left)); bottom: max(22px, env(safe-area-inset-bottom)); width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; color: var(--gold-ink); background: var(--gold); box-shadow: var(--shadow-soft); cursor: pointer; opacity: 0; visibility: hidden; transform: translateY(10px); transition: .22s; }
.back-top.show { opacity: 1; visibility: visible; transform: translateY(0); }
.back-top svg { width: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
.noscript { position: fixed; z-index: 200; inset: auto 15px 15px; padding: 14px; border: 1px solid var(--red); border-radius: 11px; color: var(--text); background: var(--surface); text-align: center; }

@media (max-width: 980px) {
  .hero { grid-template-columns: 1fr .55fr; gap: 25px; }
  .market-layout { grid-template-columns: 1fr; }
  .indicator-grid { grid-template-columns: repeat(4, 1fr); }
  .signal-rail { grid-template-columns: repeat(2, 1fr); }
  .news-toolbar { grid-template-columns: 1fr auto auto; }
  .refresh-button { grid-column: 1 / -1; }
  .property-search { grid-template-columns: .45fr 1.55fr; padding-inline: 28px; }
  .property-copy form { grid-template-columns: 1fr 130px; }
  .property-buttons { grid-column: 1 / -1; }
  .newsletter { grid-template-columns: 1fr; gap: 22px; }
}

@media (max-width: 760px) {
  html { scroll-padding-top: 116px; }
  .section-shell, .header-shell, .nav-shell { width: min(100% - 26px, var(--max)); }
  .header-shell { min-height: 72px; }
  .brand-logo { width: 49px; height: 49px; flex-basis: 49px; border-radius: 14px; }
  .brand-copy strong { font-size: .98rem; }
  .brand-copy small { display: none; }
  .connection-pill { width: 38px; padding: 0; justify-content: center; }
  .connection-pill #connectionText { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .nav-shell { height: 42px; }
  .nav-shell a, .nav-shell button { min-height: 31px; padding: 5px 9px; font-size: .72rem; }
  .hero { min-height: 0; grid-template-columns: 1fr; padding-block: 48px 42px; }
  .hero h1 { font-size: clamp(2rem, 11vw, 3.1rem); }
  .hero-radar { display: none; }
  .market-section, .signals-section, .news-section, .top-stories { padding-top: 42px; }
  .section-heading { align-items: flex-start; }
  .section-note { max-width: 130px; text-align: left; line-height: 1.6; }
  .indicator-grid { grid-template-columns: repeat(2, 1fr); }
  .signal-rail { display: flex; margin-inline: -13px; padding-inline: 13px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .signal-card { min-width: min(83vw, 300px); scroll-snap-align: start; }
  .top-story-grid { grid-template-columns: 1fr; }
  .news-toolbar { position: relative; top: auto; grid-template-columns: 1fr auto; border-radius: 15px; }
  .search-field { grid-column: 1 / -1; }
  .filter-chips { overflow-x: auto; }
  .sort-field span { display: none; }
  .sort-field select { max-width: 116px; }
  .refresh-button { grid-column: 1 / -1; }
  .news-card-head { grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px; padding: 11px; }
  .story-media { width: 58px; height: 58px; }
  .news-head-copy h3 { font-size: .83rem; }
  .feed-badge { display: none; }
  .news-head-side { min-width: 30px; }
  .compact-rating { display: none; }
  .news-card-body { padding: 0 12px 12px; }
  .feedback-panel { grid-template-columns: 1fr; padding: 13px; }
  .comment-form { grid-template-columns: 1fr; align-items: stretch; }
  .comment-form textarea { height: 70px; }
  .property-search { grid-template-columns: 1fr; padding: 28px 20px; }
  .property-art { display: none; }
  .property-copy form { grid-template-columns: 1fr; }
  .property-buttons { grid-column: auto; }
  .property-buttons button { flex: 1; }
  .newsletter { margin-block: 48px; padding: 25px 20px; }
  .newsletter-copy { align-items: flex-start; }
  .mail-icon { width: 47px; height: 47px; flex-basis: 47px; }
  .email-row { grid-template-columns: 1fr; gap: 7px; }
  .email-row input, .email-row button { border: 1px solid var(--line); border-radius: 10px; }
  .email-row button { justify-content: center; }
  .footer-shell { grid-template-columns: 1fr; }
  .footer-contact { justify-content: flex-start; }
  .reader-toolbar { grid-template-columns: auto 1fr auto; }
  .reader-label { text-align: center; }
  .reader-tools button:nth-child(-n+2) { display: none; }
  .reader-article { margin-top: 28px; }
}

@media (max-width: 400px) {
  .section-shell, .header-shell, .nav-shell { width: min(100% - 20px, var(--max)); }
  .header-actions { gap: 5px; }
  .icon-button { width: 37px; height: 37px; }
  .nav-shell button { margin-inline-start: 0; }
  .nav-shell button svg, .nav-shell button span { display: none; }
  .hero { padding-top: 38px; }
  .hero-meta { flex-direction: column; gap: 7px; }
  .indicator-card { min-height: 106px; padding: 13px; }
  .indicator-card strong { font-size: 1.1rem; }
  .section-heading.compact { align-items: flex-start; }
  .live-label { display: none; }
  .news-toolbar { grid-template-columns: 1fr; }
  .search-field, .refresh-button { grid-column: auto; }
  .filter-chips { justify-content: center; }
  .sort-field { justify-content: center; }
  .sort-field select { max-width: none; }
  .news-card-head { grid-template-columns: 49px minmax(0, 1fr) 25px; gap: 8px; }
  .story-media { width: 49px; height: 53px; }
  .news-kickers { margin-bottom: 5px; }
  .news-card-submeta span:not(:first-child) { display: none; }
  .story-actions button, .story-actions a { flex: 1 1 calc(50% - 8px); }
  .story-actions .source-link { margin-inline-start: 0; }
  .newsletter-copy { display: block; }
  .mail-icon { margin-bottom: 14px; }
  .dialog-card { padding: 22px 17px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

@media print {
  @page { margin: 18mm; }
  body { color: #111; background: #fff; }
  body > *:not(.reader-dialog), .reader-toolbar, .reader-actions { display: none !important; }
  .reader-dialog { position: static; display: block; width: auto; height: auto; color: #111; background: #fff; }
  .reader-shell { padding: 0; }
  .reader-article { width: 100%; margin: 0; }
  .reader-source, .reader-meta { color: #555; }
  .reader-body { color: #111; font-size: 12pt; line-height: 2; }
}

  </style>
</head>
<body>
  <a class="skip-link" href="#mainContent">پرش به محتوای اصلی</a>

  <header class="site-header" id="top">
    <div class="header-shell">
      <a class="brand" href="#top" aria-label="مجله رادار مسکن؛ صفحه نخست">
        <span class="brand-logo"><img src="data:image/jpeg;base64," alt="نشان حامی ویلا گستر" width="64" height="64"></span>
        <span class="brand-copy">
          <strong>مجله رادار <em>مسکن</em></strong>
          <small>دیده‌بان خبری و تحلیلی بازار ملک</small>
        </span>
      </a>

      <div class="header-actions">
        <span class="connection-pill" id="connectionPill" role="status">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="connectionText">در حال آماده‌سازی</span>
        </span>
        <button class="icon-button theme-button" id="themeToggle" type="button" aria-label="تغییر پوسته" title="پوسته خودکار">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
        </button>
      </div>
    </div>

    <nav class="main-nav" aria-label="ناوبری اصلی">
      <div class="nav-shell">
        <a href="#market">نبض بازار</a>
        <a href="#signals">سیگنال‌ها</a>
        <a href="#news">تازه‌ها</a>
        <a href="#newsletter">خبرنامه</a>
        <button type="button" id="savedOnly" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.8A1.8 1.8 0 0 1 7.8 3h8.4A1.8 1.8 0 0 1 18 4.8V21l-6-3.5L6 21V4.8Z"/></svg>
          ذخیره‌شده‌ها
          <span id="savedCount">۰</span>
        </button>
      </div>
    </nav>
  </header>

  <main id="mainContent">
    <section class="hero section-shell" aria-labelledby="heroTitle">
      <div class="hero-copy">
        <p class="eyebrow"><span></span> نسخه چهارم رادار مسکن</p>
        <h1 id="heroTitle">خبر کمتر؛ <mark>دید بهتر</mark> به بازار مسکن</h1>
        <p>پایش پیوسته خبرهای ایران و جهان، ترجمه فارسی، شاخص‌های قابل‌اتکا و ابزارهای تصمیم‌یار در یک تجربه سریع، امن و در دسترس.</p>
        <div class="hero-meta">
          <span id="updatedAt">آخرین برداشت: —</span>
          <span id="nextUpdate">دور بعد: —</span>
        </div>
      </div>
      <div class="hero-radar" aria-hidden="true">
        <div class="radar-grid"><i></i><i></i><i></i><span></span><b></b></div>
        <p><strong id="heroCount">۰</strong><span>خبر در رادار</span></p>
      </div>
    </section>

    <section class="market-section section-shell" id="market" aria-labelledby="marketTitle">
      <div class="section-heading">
        <div>
          <p class="kicker">داشبورد روزانه</p>
          <h2 id="marketTitle">نبض بازار در یک نگاه</h2>
        </div>
        <div class="section-note" id="marketUpdated">در حال دریافت شاخص‌ها…</div>
      </div>

      <div class="market-layout">
        <article class="analysis-card">
          <div class="analysis-head">
            <span class="analysis-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 18V9m5 9V5m5 13v-7m5 7V3M2 21h20"/></svg>
            </span>
            <div><span>تحلیل روز</span><small id="analysisMode">بر پایه رصد خبری</small></div>
          </div>
          <h3 id="analysisTitle">در حال ساخت تصویر روز بازار…</h3>
          <p id="analysisBody">داده‌های تازه پس از بارگذاری خبرها نمایش داده می‌شوند.</p>
          <div class="analysis-tags" id="analysisTags" aria-label="نکات کلیدی"></div>
          <p class="analysis-disclaimer">این بخش گزارش تحلیلی است و توصیه خرید یا سرمایه‌گذاری محسوب نمی‌شود.</p>
        </article>

        <div class="indicator-panel">
          <div class="indicator-grid" id="indicatorGrid" aria-live="polite"></div>
          <article class="chart-card" aria-labelledby="chartTitle">
            <div class="chart-head">
              <div><h3 id="chartTitle">روند انتشار هفت‌روزه</h3><p>برای جزئیات روی ستون‌ها تمرکز کنید.</p></div>
              <strong id="weekTotal">۰ خبر</strong>
            </div>
            <div class="mini-chart" id="weekChart" role="group" aria-label="نمودار تعداد خبرهای هفت روز اخیر"></div>
          </article>
        </div>
      </div>
    </section>

    <section class="signals-section section-shell" id="signals" aria-labelledby="signalsTitle">
      <div class="section-heading compact">
        <div>
          <p class="kicker">رصد لحظه‌ای</p>
          <h2 id="signalsTitle">آخرین سیگنال‌های بازار</h2>
        </div>
        <span class="live-label"><i></i> زنده از جریان خبر</span>
      </div>
      <div class="signal-rail" id="signalRail" aria-live="polite"></div>
    </section>

    <section class="top-stories section-shell" id="topStories" aria-labelledby="topStoriesTitle" hidden>
      <div class="section-heading compact">
        <div>
          <p class="kicker">منتخب مخاطبان</p>
          <h2 id="topStoriesTitle">پربیننده‌ترین خبرها</h2>
        </div>
      </div>
      <div class="top-story-grid" id="topStoryGrid"></div>
    </section>

    <section class="news-section section-shell" id="news" aria-labelledby="newsTitle">
      <div class="section-heading news-heading">
        <div>
          <p class="kicker">خوراک خبری</p>
          <h2 id="newsTitle">تازه‌ترین خبرها</h2>
        </div>
        <p id="resultCount" role="status" aria-live="polite">در حال بارگذاری…</p>
      </div>

      <div class="news-toolbar" aria-label="ابزارهای فیلتر اخبار">
        <label class="search-field" for="searchInput">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.3-4.3m2.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
          <input id="searchInput" type="search" placeholder="جستجو در عنوان، خلاصه یا منبع…" autocomplete="off">
          <span class="search-spinner" id="searchSpinner" aria-hidden="true"></span>
          <button type="button" id="clearSearch" aria-label="پاک‌کردن جستجو" title="پاک‌کردن" hidden>×</button>
        </label>

        <div class="filter-chips" role="group" aria-label="منطقه خبر">
          <button type="button" class="active" data-filter="all" aria-pressed="true">همه</button>
          <button type="button" data-filter="iran" aria-pressed="false">ایران</button>
          <button type="button" data-filter="world" aria-pressed="false">جهان</button>
        </div>

        <label class="sort-field" for="sortBy">
          <span>مرتب‌سازی</span>
          <select id="sortBy">
            <option value="recent">جدیدترین</option>
            <option value="popular">پربیننده‌ترین</option>
            <option value="discussed">پربحث‌ترین</option>
          </select>
        </label>

        <button class="refresh-button" id="refreshButton" type="button">
          <span class="button-spinner" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5m10.1-3A8 8 0 0 0 5.3 6.8L4 11m16 2-1.3 4.2A8 8 0 0 1 4.9 14"/></svg>
          <span class="button-label">برداشت تازه</span>
        </button>
      </div>

      <div class="active-filter" id="activeFilter" hidden>
        <span id="activeFilterText"></span>
        <button type="button" id="resetFilters">حذف فیلترها</button>
      </div>

      <div class="news-grid" id="newsGrid" aria-live="polite" aria-busy="true"></div>
      <button class="load-more" id="loadMore" type="button" hidden>نمایش خبرهای بیشتر</button>
    </section>

    <section class="property-search section-shell" aria-labelledby="propertyTitle">
      <div class="property-art" aria-hidden="true">
        <svg viewBox="0 0 160 130"><path d="M18 72 80 20l62 52v47H18V72Z"/><path d="M63 119V79h34v40M40 62V34h20v11"/><circle cx="125" cy="36" r="19"/><path d="m139 50 14 14"/></svg>
      </div>
      <div class="property-copy">
        <p class="kicker">جستجوی کاربردی</p>
        <h2 id="propertyTitle">ملک بعدی‌تان را پیدا کنید</h2>
        <p>عبارت و نوع معامله را وارد کنید؛ جستجو در پلتفرم منتخب شما باز می‌شود.</p>
        <form id="propertyForm">
          <label><span>شهر، محله یا نوع ملک</span><input id="propertyQuery" type="search" value="رویان ویلا" placeholder="مثلاً رویان ویلا"></label>
          <label><span>نوع معامله</span><select id="propertyType"><option value="buy">خرید</option><option value="rent">رهن و اجاره</option><option value="sell">فروش</option></select></label>
          <div class="property-buttons">
            <button type="button" data-platform="divar" class="divar-button">دیوار</button>
            <button type="button" data-platform="sheypoor" class="sheypoor-button">شیپور</button>
          </div>
        </form>
      </div>
    </section>

    <section class="newsletter section-shell" id="newsletter" aria-labelledby="newsletterTitle">
      <div class="newsletter-copy">
        <span class="mail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11Z"/><path d="m4 7 8 6 8-6"/></svg>
        </span>
        <div><p class="kicker">خلاصه‌ای که ارزش بازکردن دارد</p><h2 id="newsletterTitle">رادار هفتگی را ایمیل بگیرید</h2><p>مهم‌ترین روندها و خبرهای مسکن؛ بدون پیام اضافه و با امکان لغو فوری.</p></div>
      </div>
      <form id="newsletterForm" novalidate>
        <label for="newsletterEmail">نشانی ایمیل</label>
        <div class="email-row"><input id="newsletterEmail" name="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" required><button type="submit"><span class="button-spinner" aria-hidden="true"></span><span>عضویت رایگان</span></button></div>
        <label class="consent"><input id="newsletterConsent" type="checkbox" required><span>با دریافت خبرنامه و سیاست حفظ حریم خصوصی موافقم.</span></label>
        <p class="form-message" id="newsletterMessage" role="status"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-shell section-shell">
      <div class="footer-brand">
        <img src="data:image/jpeg;base64," alt="" width="54" height="54">
        <div><strong>شرکت حامی ویلا گستر</strong><span>صاحب‌امتیاز مجله رادار مسکن</span></div>
      </div>
      <div class="footer-contact">
        <span>مازندران، نور، رویان</span>
        <a href="mailto:Hamivillagostar@gmail.com">Hamivillagostar@gmail.com</a>
        <a href="https://instagram.com/hami.villa" target="_blank" rel="noopener noreferrer">@hami.villa</a>
        <a href="tel:+989123583465" dir="ltr">+98 912 358 3465</a>
      </div>
      <p class="footer-note">خبرها از منابع ثالث گردآوری می‌شوند. برای بررسی دقیق، همواره متن و منبع اصلی را ببینید. ترجمه‌های ماشینی ممکن است نیازمند بازبینی باشند.</p>
    </div>
  </footer>

  <dialog class="reader-dialog" id="readerDialog" aria-labelledby="readerTitle">
    <div class="reader-shell">
      <div class="reader-toolbar">
        <button type="button" class="dialog-close" data-close="readerDialog" aria-label="بستن حالت مطالعه">×</button>
        <span class="reader-label">حالت مطالعه</span>
        <div class="reader-tools">
          <button type="button" id="readerDecrease" aria-label="کوچک‌کردن متن">الف−</button>
          <button type="button" id="readerIncrease" aria-label="بزرگ‌کردن متن">الف+</button>
          <button type="button" id="readerPrint" aria-label="چاپ خبر">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6v-7Z"/></svg>
          </button>
        </div>
      </div>
      <article class="reader-article" id="printArea">
        <div class="reader-source" id="readerSource"></div>
        <h2 id="readerTitle"></h2>
        <p class="reader-meta" id="readerMeta"></p>
        <div class="reader-body" id="readerBody"></div>
        <div class="reader-actions" id="readerActions"></div>
      </article>
    </div>
  </dialog>

  <dialog class="report-dialog" id="reportDialog" aria-labelledby="reportTitle">
    <form method="dialog" class="dialog-card" id="reportForm">
      <button type="button" class="dialog-close" data-close="reportDialog" aria-label="بستن">×</button>
      <p class="kicker">کنترل کیفیت</p>
      <h2 id="reportTitle">گزارش اشکال در خبر</h2>
      <p>نوع مشکل را مشخص کنید تا تیم تحریریه بتواند آن را بررسی کند.</p>
      <input type="hidden" id="reportNewsId" name="news_id">
      <label><span>نوع اشکال</span><select id="reportType" name="type" required><option value="translation">اشکال در ترجمه</option><option value="facts">اطلاعات نادرست یا قدیمی</option><option value="source">مشکل منبع یا پیوند</option><option value="other">سایر</option></select></label>
      <label><span>توضیح کوتاه</span><textarea id="reportNote" name="note" rows="4" maxlength="500" placeholder="اختیاری"></textarea></label>
      <div class="dialog-actions"><button type="button" class="secondary" data-close="reportDialog">انصراف</button><button type="submit" class="primary">ارسال گزارش</button></div>
      <p class="form-message" id="reportMessage" role="status"></p>
    </form>
  </dialog>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  <button class="back-top" id="backTop" type="button" aria-label="بازگشت به بالای صفحه">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
