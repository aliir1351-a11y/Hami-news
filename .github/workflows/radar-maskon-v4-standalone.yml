  <script nonce="RadarMaskanV4Standalone" type="application/json" id="radar-bootstrap">{"updated_at":"2026-08-19T20:03:23.576176+00:00","next_update":"2026-08-19T21:03:23.576176+00:00","items":[{"id":"b47e3cba983bdef8","title":"به روز رسانی تابستانی بازار مسکن ایالات متحده","title_orig":"Summertime U.S. housing market update - HBS Dealer","summary":"به روز رسانی تابستانی بازار مسکن ایالات متحده. به روز رسانی بازار مسکن فروشنده HBS","source":"HBS Dealer","url":"https://news.google.com/rss/articles/CBMiaEFVX3lxTE1ab0RILUxxdnk3dmdLRTYyZkNmcTRQdkF5b24wVlROV2d5cFV2M3IzRjRydTd3czMwbWh6V2NJUHFoYi1rZmFobkozUVBNWVNaV1p4d0hVb1p6R1Z1TjlTc3pZWVZCWDFT?oc=5","published":"2026-08-19T19:06:00+00:00","region":"world","feed":"جهان — بازار مسکن","full_fa":"خانه های بیشتری برای فروش و تثبیت قیمت، اما شرایط بسته به مکان بسیار متفاوت است. طبق داده‌های 46 منطقه متروی بررسی‌شده در گزارش ملی مسکن REMAX در جولای 2026، خریداران خانه گزینه‌های بیشتری در جولای داشتند، زیرا تعداد خانه‌های برای فروش هم نسبت به ماه قبل و هم در سال قبل افزایش یافته بود، در حالی که قیمت‌ها در طول ماه ثابت بود. موجودی انبار نسبت به ژوئن 2.8 درصد و نسبت به سال قبل 4.7 درصد افزایش یافت، در حالی که قیمت متوسط ​​فروش در 450,000 دلار ثابت ماند و 3.4 درصد نسبت به سال قبل افزایش یافت. به گفته REMAX، موجودی اضافی ممکن است فرصت بیشتری را برای خریداران در برخی بازارها ایجاد کند، اما داده ها همچنین به یک محیط مسکن بسیار محلی اشاره می کند.\n\nبرخی از متروها افزایش قابل توجه موجودی و عرضه ماه های بالاتر را به ثبت رساندند، در حالی که برخی دیگر همچنان شاهد عرضه محدودتر نسبت به سال گذشته بودند. خریداران و فروشندگان بسته به محل زندگی خود ممکن است شرایط متفاوتی را تجربه کنند. این تغییر در میامی مشهود است، جایی که معاملات بسته نسبت به سال گذشته 11.8 درصد افزایش یافته است و بازار را در بین پنج مترو برتر برای رشد فروش سالانه قرار می دهد. آنتونی آسکوویتز، کارگزار/مالک REMAX Advance Realty در میامی، فلوریدا، گفت: \"داده های این ماه منعکس کننده بازار دائمی در حال تغییر املاک در میامی است.\" ما در ماه جولای فروش بیشتری داشتیم زیرا خریداران فرصت‌هایی را در طیف وسیع‌تری از قیمت‌ها پیدا کردند.\n\nفروشندگان نیز در حال تبدیل شدن به ذکاوت هستند و درک می کنند که اگر نمی خواهند اموالشان در بازار بماند، باید قیمت مناسبی داشته باشند. به‌عنوان نماینده، تمرکز ما بر آموزش خریداران و فروشندگان در مورد واقعیت بازار امروز و انتظارات در یک محدوده قیمت معین است.\" در سطح ملی، فروش مسکن 5.7 درصد نسبت به ماه قبل کاهش یافت، اما 2.5 درصد بیشتر از سال قبل بود. فهرست‌های جدید نسبت به ماه قبل 2.7 درصد کاهش داشتند اما 1.4 درصد سالانه نسبت به ماه قبل افزایش یافتند. 2.9 خانه های فروخته شده در ماه ژوئیه به طور متوسط 45 روز در بازار سپری کردند که نسبت به ماه قبل و یک روز بیشتر از سال گذشته بود.\n\nمیانگین قیمت فهرست‌بندی فهرست‌های جدید 1.1 درصد در ماه نسبت به ماه و 1.8 درصد در سال نسبت به سال افزایش یافته است. نسبت قیمت نزدیک به لیست در 99 درصد باقی مانده است، بدون تغییر نسبت به ماه قبل و یک سال قبل. نکات برجسته و نتایج بازار محلی برای ژوئیه عبارتند از: فهرست‌های جدید در 46 منطقه متروی بررسی‌شده در ژوئیه 2026، تعداد خانه‌های تازه فهرست‌شده به طور متوسط 1.4 درصد نسبت به ژوئیه 2025 و 2.7 درصد نسبت به ژوئن 2026 کاهش داشته است. جولای 2026 ژوئیه 2025 درصد تغییر نسبت به سال انکوریج، AK 805 662+21.6% St.\n\nLouis, MO 4,590 4,087+12.3% ایندیاناپولیس، IN 3,912 3,533 + 10.7٪ Providence, RI 1,941 1,779+9.1% مینیاپولیس، MN 7,192 6,661 + 8.0٪ لیست‌های جدید: 5 بازار با بیشترین کاهش سالانه بازار جولای 2026 جولای 2025 درصد تغییر سال به سال San Antonio, TX 4,433 4,999-11.3% بالتیمور، MD 3،559 3،873-8.1٪ San Diego, CA 3,530 3,744-5.7% ویچیتا، KS 1,052 1,109-5.1٪ واشنگتن دی سی 7678 8071-4.9% معاملات بسته از 46 منطقه متروی بررسی شده در ژوئیه 2026، تعداد کل فروش خانه به طور متوسط 2.5% نسبت به جولای 2025 افزایش یافته است و 5.7% نسبت به ژوئن 2026 کاهش داشته است.\n\n5 بازار با بیشترین افزایش سالانه بازار ژوئیه 2026 ژوئیه 2025 درصد تغییر نسبت به سال","source_fa":"نمایندگی HBS"},{"id":"c1c465050bba7043","title":"4 شهر تگزاس در صدر فهرست «با انگیزه ترین» بازارهای مسکن – در حالی که فروشندگان به شدت قیمت ها را کاهش می دهند تا خریداران پیدا کنند.","title_orig":